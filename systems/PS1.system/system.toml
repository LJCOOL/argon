name = "PlayStation"
tags = ["PS", "PSX"]
core = "pcsx_rearmed"
extensions = [".bin", ".cue", ".img", ".pbp", ".chd"]
aspect_ratio = "4:3"
integer = false
requires_bios = true

[core_options]

pcsx_rearmed_drc = "enabled"

pcsx_rearmed_bios = "auto"

pcsx_rearmed_spu_irq_mode = "async"

pcsx_rearmed_rgb32_output = "disabled"

pcsx_rearmed_spu_reverb = "disabled"

pcsx_rearmed_spu_thread = "enabled"

pcsx_rearmed_gpu_thread_rendering = "auto"

pcsx_rearmed_memcard1 = "libretro"

pcsx_rearmed_memcard2 = "shared"
